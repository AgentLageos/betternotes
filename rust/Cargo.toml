[package]
name = "bn_renderer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]   # rlib: for tests, examples and benchmarks

[dependencies]
flutter_rust_bridge = "=2.13.0"
tiny-skia = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Debug APKs/apps build the crate with the dev profile (cargokit passes --release only for release
# builds). Unoptimized Rust is ~3x slower (R1-06), so optimize it like a release build.
[profile.dev]
opt-level = 3
